name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Novo Gráfico: Estilo Cartão de Visitas Científico (Totalmente diferente!)
      - name: GitHub Stats Card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Lgnlab
          filename: stats-output/stats.svg
          template: repository
          base: header, activity, community, repositories
          base_indepth: yes # Força a API a minerar dados mais profundos dos commits
          config_timezone: America/Sao_Paulo

      # Novo Gráfico de Linguagens: Estilo Gráfico de Pizza Tridimensional
      - name: Languages Card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Lgnlab
          filename: languages-output/languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_sections: most-used
          plugin_languages_details: percentage, lines
          plugin_languages_indepth: yes # Vasculha todas as suas ramificações (branches) atrás de linguagens
          plugin_languages_limit: 8
