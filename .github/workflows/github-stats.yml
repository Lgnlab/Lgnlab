name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *" # Executa uma vez por dia
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Metric Cards
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Lgnlab
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Sao_Paulo
          
          # Configuração para salvar os arquivos nas pastas corretas
          filename: stats-output/stats.svg
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: bytes-percentage, lines
          # Nota: Esta action gera um arquivo unificado por padrão.
