name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Primeiro cartão (Estatísticas Gerais) em Preto
      - name: General Stats Card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Lgnlab
          filename: stats-output/stats.svg
          base: header, activity, repositories
          config_timezone: America/Sao_Paulo
          config_theme: github_dark # <- Força o gráfico a ser gerado em fundo escuro/preto

      # Segundo cartão (Linguagens) em Preto
      - name: Languages Card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Lgnlab
          filename: languages-output/languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 5
          config_theme: github_dark # <- Força o gráfico a ser gerado em fundo escuro/preto
